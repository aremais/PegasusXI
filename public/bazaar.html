  <script>
    (function() {
      var loadingEl = document.getElementById("bazaarLoading");
      var listEl = document.getElementById("bazaarList");

      function render(list) {
        var rows = Array.isArray(list) ? list : [];
        if (rows.length === 0) {
          if (loadingEl) loadingEl.style.display = "block";
          if (listEl) { listEl.style.display = "none"; listEl.innerHTML = ""; }
          if (loadingEl) loadingEl.textContent = "Loading bazaar listings...";
        } else {
          if (loadingEl) loadingEl.style.display = "none";
          if (listEl) {
            listEl.style.display = "block";
            listEl.innerHTML = "<table class=\"bazaar-table\"><thead><tr><th scope=\"col\">Character</th><th scope=\"col\">Zone</th><th scope=\"col\">Listings</th></tr></thead><tbody>" +
              rows.map(function(row) {
                return "<tr><td><a href=\"players.html\">" + (row.character || "—") + "</a></td><td>" + (row.zone || "—") + "</td><td>" + (row.listings || "—") + "</td></tr>";
              }).join("") + "</tbody></table>";
          }
        }
      }

      // Placeholder: replace with your API (e.g. fetch("/api/bazaar").then(r=>r.json()))
      render([]);
      // Optional: fetch and then render(data)
      // fetch("/api/bazaar").then(function(r){ return r.json(); }).then(function(data){
      //   render(data.listings || data || []);
      // }).catch(function(){ if(loadingEl) loadingEl.textContent = "Unable to load bazaar."; });
    })();
  </script>
