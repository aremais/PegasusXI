  <main class="container" style="padding: 18px 0 0;">
    <section class="card pad">
      <h1 class="players-title">Players</h1>

      <div class="players-toolbar">
        <input type="search" class="input players-search" id="playersSearch" placeholder="Search character name..." aria-label="Search players" />
      </div>

      <div id="playersList" class="players-list" aria-label="Online players">
        <p class="players-empty" id="playersEmpty">Loading players…</p>
      </div>

      <p class="small players-count" id="playersCount" aria-live="polite"></p>
    </section>
  </main>

  <div id="siteFooter"></div>
  <script src="api-config.js"></script>
  <script src="app.js"></script>
  <script>
    (function() {
      var container = document.getElementById("playersList");
      var emptyEl = document.getElementById("playersEmpty");
      var searchEl = document.getElementById("playersSearch");
      var countEl = document.getElementById("playersCount");
      if (!container) return;

      function escapeHtml(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
      function playerCard(p) {
        var name = escapeHtml(p.name || "—");
        var mainJob = escapeHtml(p.mainJob || p.job || "");
        var mainLvl = p.mainLvl != null ? p.mainLvl : (p.level != null ? p.level : "");
        var subJob = escapeHtml(p.subJob || "");
        var subLvl = p.subLvl != null ? p.subLvl : "";
        var jobText = mainJob ? mainJob + " " + mainLvl + (subJob ? " / " + subJob + " " + subLvl : "") : "—";
        var nation = escapeHtml(p.nation || "");
        var rank = p.rank != null ? p.rank : "";
        var linkshell = escapeHtml(p.linkshell || "");
        var lsColor = p.linkshellColor;
        var lsStyle = lsColor ? " style=\"color:" + escapeHtml(lsColor) + "\"" : "";
        var avatar = p.avatar ? "<img src=\"" + escapeHtml(p.avatar) + "\" alt=\"\" class=\"player-card-avatar\" />" : "<span class=\"player-card-avatar player-card-avatar-placeholder\">" + (name.charAt(0) !== "—" ? name.charAt(0) : "?") + "</span>";
        return "<article class=\"player-card\">" +
          "<div class=\"player-card-avatar-wrap\">" + avatar + "</div>" +
          "<div class=\"player-card-info\">" +
            "<div class=\"player-card-name\">" + name + "</div>" +
            "<div class=\"player-card-job\">" + jobText + "</div>" +
          "</div>" +
          "<div class=\"player-card-meta\">" +
            "<div class=\"player-card-nation\">" +
              "<span class=\"player-card-crest\" title=\"" + nation + "\" aria-hidden=\"true\"></span>" +
              "<span class=\"player-card-rank\">Rank " + rank + "</span>" +
            "</div>" +
            "<div class=\"player-card-ls\">" +
              "<span class=\"player-card-ls-icon\" aria-hidden=\"true\"></span>" +
              "<span class=\"player-card-ls-name\"" + lsStyle + ">" + (linkshell || "—") + "</span>" +
            "</div>" +
          "</div>" +
          "</article>";
      }

      function render(players, filter) {
        var list = Array.isArray(players) ? players : [];
        if (filter) {
          var q = (filter || "").trim().toLowerCase();
          if (q) list = list.filter(function(p) { return (p.name || "").toLowerCase().indexOf(q) !== -1; });
        }
        container.querySelectorAll(".player-card").forEach(function(el) { el.remove(); });
        if (list.length === 0) {
          if (emptyEl) { emptyEl.style.display = "block"; emptyEl.textContent = "No players found."; }
        } else {
          if (emptyEl) emptyEl.style.display = "none";
          list.forEach(function(p) {
            var div = document.createElement("div");
            div.innerHTML = playerCard(p);
            container.appendChild(div.firstElementChild);
          });
        }
        if (countEl) countEl.textContent = list.length + " player(s) online";
      }

      if (searchEl) searchEl.addEventListener("input", function() { render(window.__playersList || [], searchEl.value); });

      var placeholder = [
        { name: "Aaalr", mainJob: "SMN", mainLvl: 75, subJob: "WHM", subLvl: 37, nation: "Windurst", rank: 6, linkshell: "OmenFromFenrir" },
        { name: "Runedrake", mainJob: "WHM", mainLvl: 99, subJob: "BLM", subLvl: 49, nation: "Bastok", rank: 10, linkshell: "Seekers" }
      ];
      window.__playersList = placeholder;
      render(placeholder);

      var base = (window.API_BASE || "").replace(/\/$/, "");
      fetch(base + "/api/players")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var list = data.players || data || [];
          if (list.length > 0) {
            window.__playersList = list;
            render(list, searchEl ? searchEl.value : "");
          }
        })
        .catch(function() {});
    })();
  </script>
