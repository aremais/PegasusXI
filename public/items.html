  <script>
    (function() {
      var form = document.getElementById("itemsSearchForm");
      var input = document.getElementById("itemsSearch");
      var emptyEl = document.getElementById("itemsEmpty");
      var listEl = document.getElementById("itemsList");

      function getSearchFromUrl() {
        var params = new URLSearchParams(location.search);
        return params.get("search") || "";
      }

      function setSearchInUrl(q) {
        var url = "items.html";
        if (q) url += "?search=" + encodeURIComponent(q);
        if (location.search !== (q ? "?search=" + encodeURIComponent(q) : "")) {
          history.replaceState({}, "", url);
        }
      }

      function render(results) {
        var list = Array.isArray(results) ? results : [];
        if (list.length === 0) {
          if (emptyEl) emptyEl.style.display = "block";
          if (listEl) { listEl.style.display = "none"; listEl.innerHTML = ""; }
        } else {
          if (emptyEl) emptyEl.style.display = "none";
          if (listEl) {
            listEl.style.display = "block";
            listEl.innerHTML = "<table class=\"items-table\"><thead><tr><th scope=\"col\">Item</th><th scope=\"col\">Category</th><th scope=\"col\">Level</th></tr></thead><tbody>" +
              list.map(function(item) {
                return "<tr><td>" + (item.name || "—") + "</td><td>" + (item.category || "—") + "</td><td>" + (item.level != null ? item.level : "—") + "</td></tr>";
              }).join("") + "</tbody></table>";
          }
        }
      }

      function doSearch() {
        var q = (input && input.value) ? input.value.trim() : getSearchFromUrl();
        if (input && input.value !== q) input.value = q;
        setSearchInUrl(q);
        // Placeholder: replace with your API (e.g. fetch("/api/items?search=" + encodeURIComponent(q)))
        render([]);
      }

      if (input) {
        input.value = getSearchFromUrl();
        input.addEventListener("input", function() { setSearchInUrl(input.value.trim()); });
      }
      if (form) form.addEventListener("submit", function(e) { e.preventDefault(); doSearch(); });

      doSearch();
    })();
  </script>
