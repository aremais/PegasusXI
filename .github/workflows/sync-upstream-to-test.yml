name: Sync upstream into test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote if missing
        run: |
          $remotes = git remote
          if ($remotes -notcontains "upstream") {
            git remote add upstream https://github.com/LandSandBoat/server.git
          }

          git fetch upstream --tags

      - name: Merge upstream and preserve files modified on test
        run: |
          git checkout test

          $mergeBase = git merge-base test upstream/base
          if (-not $mergeBase) {
            throw "Could not determine merge base between test and upstream/base."
          }

          $protectedFileList = Join-Path $env:RUNNER_TEMP "protected-files.txt"
          $protectedFiles = git diff --name-only $mergeBase test

          if ($protectedFiles) {
            Write-Host "Files changed on test that will be preserved:"
            $protectedFiles | ForEach-Object { Write-Host " - $_" }
            $protectedFiles | Set-Content -Path $protectedFileList
          } else {
            Write-Host "No files changed on test since merge base."
          }

          git merge upstream/base --no-commit --no-ff

          if (Test-Path $protectedFileList) {
            Get-Content $protectedFileList | ForEach-Object {
              $file = $_.Trim()

              if ($file) {
                Write-Host "Restoring test version of $file"
                git restore --source=HEAD --staged --worktree -- "$file" 2>$null

                if ($LASTEXITCODE -ne 0) {
                  Write-Host "Could not restore $file cleanly; continuing"
                  $global:LASTEXITCODE = 0
                }
              }
            }
          }

          $remainingConflicts = git diff --name-only --diff-filter=U
          if ($remainingConflicts) {
            throw "Unresolved conflicts remain:`n$($remainingConflicts -join "`n")"
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }

          git commit -m "Sync upstream/base into test (preserve files modified on test)"
          git push origin test
