name: Sync upstream into Test

# DISABLED for normal operations.
# Use the staged pipeline instead:
#   1) Sync LSB into Base
#   2) Sync base into Test
# This workflow bypasses base and is kept only as an emergency fallback.
# Keep it disabled in the GitHub Actions UI.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Test branch
        uses: actions/checkout@v6
        with:
          ref: Test
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote if missing
        run: |
          $remotes = git remote

          if ($remotes -notcontains "upstream") {
            git remote add upstream https://github.com/LandSandBoat/server.git
          }

          git fetch upstream --tags

      - name: Merge upstream, preserve settings, block workflow-file changes, and keep Test branch conflicts
        run: |
          git checkout Test

          Write-Host "Conflict strategy: always keep Test branch version"

          git merge upstream/base --no-commit --no-ff
          $mergeExit = $LASTEXITCODE

          Write-Host "Merge exit code: $mergeExit"

          Write-Host "Restoring Test version of settings/ and settings/default/"
          git restore --source=HEAD --staged --worktree -- settings settings/default 2>$null
          $global:LASTEXITCODE = 0

          Write-Host "Auto-preserving conflicted workflow files from Test"
          $workflowConflicts = @(git diff --name-only --diff-filter=U -- .github/workflows)

          if ($workflowConflicts.Count -gt 0) {
            foreach ($file in $workflowConflicts) {
              Write-Host "Keeping Test version of workflow file: $file"
              git checkout --ours -- "$file"
              git add "$file"
            }
          }

          Write-Host "Removing any staged workflow-file changes before commit"
          $workflowChanges = @(git diff --name-only --cached -- .github/workflows)

          if ($workflowChanges.Count -gt 0) {
            foreach ($file in $workflowChanges) {
              Write-Host "Reverting staged workflow file: $file"

              git show "HEAD:$file" > $null 2>&1

              if ($LASTEXITCODE -eq 0) {
                git checkout HEAD -- "$file"
              } else {
                git rm --cached --force -- "$file" 2>$null

                if (Test-Path $file) {
                  Remove-Item -Force "$file"
                }
              }

              $global:LASTEXITCODE = 0
            }
          }

          $stillWorkflowChanges = @(git diff --name-only --cached -- .github/workflows)

          if ($stillWorkflowChanges.Count -gt 0) {
            Write-Host "Workflow files still staged:"
            $stillWorkflowChanges | ForEach-Object { Write-Host " - $_" }
            throw "Workflow file changes are still staged. Stopping before push."
          }

          $remainingConflicts = @(git diff --name-only --diff-filter=U)

          if ($remainingConflicts.Count -gt 0) {
            Write-Host "Remaining non-settings conflicts detected. Keeping Test branch version for all:"
            $remainingConflicts | ForEach-Object { Write-Host " - $_" }

            foreach ($file in $remainingConflicts) {
              Write-Host "Keeping Test version of $file"

              git checkout --ours -- "$file" 2>$null

              if ($LASTEXITCODE -eq 0) {
                git add "$file"
              } else {
                Write-Host "Test branch does not have $file, keeping it deleted."

                git rm --cached --force -- "$file" 2>$null

                if (Test-Path $file) {
                  Remove-Item -Force "$file"
                }

                $global:LASTEXITCODE = 0
              }
            }
          }

          $stillConflicted = @(git diff --name-only --diff-filter=U)

          if ($stillConflicted.Count -gt 0) {
            Write-Host "Unresolved conflicts still remain:"
            $stillConflicted | ForEach-Object { Write-Host " - $_" }
            throw "Unable to fully resolve merge conflicts."
          }

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }

          git status --short

          git commit -m "Sync upstream/base into Test"

          git push origin Test
