name: Sync upstream into test

on:
  workflow_dispatch:
    inputs:
      conflict_strategy:
        description: "How should non-settings conflicts be handled?"
        required: true
        type: choice
        options:
          - manual
          - ours
          - theirs
        default: manual
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote if missing
        run: |
          $remotes = git remote
          if ($remotes -notcontains "upstream") {
            git remote add upstream https://github.com/LandSandBoat/server.git
          }

          git fetch upstream --tags

      - name: Merge upstream, preserve settings, block workflow-file changes, and handle remaining conflicts
        run: |
          git checkout test

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $strategy = "${{ github.event.inputs.conflict_strategy }}"
          } else {
            $strategy = "manual"
          }

          Write-Host "Conflict strategy: $strategy"

          git merge upstream/base --no-commit --no-ff
          $mergeExit = $LASTEXITCODE

          Write-Host "Restoring test version of settings/ and settings/default/"
          git restore --source=HEAD --staged --worktree -- settings settings/default 2>$null
          $global:LASTEXITCODE = 0

          Write-Host "Removing any staged workflow-file changes before commit"
          $workflowChanges = @(git diff --name-only --cached -- .github/workflows)

          if ($workflowChanges.Count -gt 0) {
            foreach ($file in $workflowChanges) {
              Write-Host "Reverting workflow file: $file"

              git show "HEAD:$file" > $null 2>&1
              if ($LASTEXITCODE -eq 0) {
                git checkout HEAD -- "$file"
              } else {
                git rm --cached --force -- "$file" 2>$null
                if (Test-Path $file) {
                  Remove-Item -Force "$file"
                }
              }

              $global:LASTEXITCODE = 0
            }
          }

          $stillWorkflowChanges = @(git diff --name-only --cached -- .github/workflows)
          if ($stillWorkflowChanges.Count -gt 0) {
            Write-Host "Workflow files still staged:"
            $stillWorkflowChanges | ForEach-Object { Write-Host " - $_" }
            throw "Workflow file changes are still staged. Stopping before push."
          }

          $remainingConflicts = @(git diff --name-only --diff-filter=U)

          if ($remainingConflicts.Count -gt 0) {
            Write-Host "Remaining non-settings conflicts detected:"
            $remainingConflicts | ForEach-Object { Write-Host " - $_" }

            switch ($strategy) {
              "manual" {
                Add-Content $env:GITHUB_STEP_SUMMARY "## Merge conflicts need your decision"
                Add-Content $env:GITHUB_STEP_SUMMARY ""
                Add-Content $env:GITHUB_STEP_SUMMARY "The following non-settings files still conflict:"
                Add-Content $env:GITHUB_STEP_SUMMARY ""

                foreach ($file in $remainingConflicts) {
                  Add-Content $env:GITHUB_STEP_SUMMARY "- $file"
                }

                Add-Content $env:GITHUB_STEP_SUMMARY ""
                Add-Content $env:GITHUB_STEP_SUMMARY "### Your choices"
                Add-Content $env:GITHUB_STEP_SUMMARY "- Re-run this workflow with **conflict_strategy = ours** to keep the current **test** version of the conflicted files."
                Add-Content $env:GITHUB_STEP_SUMMARY "- Re-run this workflow with **conflict_strategy = theirs** to keep the **upstream** version of the conflicted files."
                Add-Content $env:GITHUB_STEP_SUMMARY "- Or resolve the conflicts manually in Git and push the result to **test**."

                throw "Manual decision required. Re-run with conflict_strategy=ours or conflict_strategy=theirs."
              }

              "ours" {
                foreach ($file in $remainingConflicts) {
                  Write-Host "Keeping TEST version of $file"
                  git checkout --ours -- "$file"
                  git add "$file"
                }
              }

              "theirs" {
                foreach ($file in $remainingConflicts) {
                  Write-Host "Keeping UPSTREAM version of $file"
                  git checkout --theirs -- "$file"
                  git add "$file"
                }
              }

              default {
                throw "Unknown conflict strategy: $strategy"
              }
            }
          }

          $stillConflicted = @(git diff --name-only --diff-filter=U)
          if ($stillConflicted.Count -gt 0) {
            Write-Host "Unresolved conflicts still remain:"
            $stillConflicted | ForEach-Object { Write-Host " - $_" }
            throw "Unable to fully resolve merge conflicts."
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }

          git commit -m "Sync upstream/base into test (preserve settings; strategy: $strategy)"
          git push origin test
