name: Sync upstream into test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote if missing
        run: |
          $remotes = git remote
          if ($remotes -notcontains "upstream") {
            git remote add upstream https://github.com/LandSandBoat/server.git
          }

          git fetch upstream --tags

      - name: Merge upstream into test
        run: |
          git checkout test
          git merge upstream/base --no-commit --no-ff

      - name: Always preserve settings files from test
        run: |
          git restore --source=HEAD --staged --worktree -- settings settings/default

      - name: Stop if any non-settings conflicts remain
        run: |
          $remainingConflicts = git diff --name-only --diff-filter=U

          if ($remainingConflicts) {
            Write-Host "Manual review is required for these conflicted files:"
            $remainingConflicts | ForEach-Object { Write-Host " - $_" }
            throw "Merge conflicts remain outside settings/. Resolve them manually."
          }

      - name: Skip if nothing changed
        run: |
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }

      - name: Commit and push merged changes
        run: |
          git commit -m "Sync upstream/base into test (preserve settings)"
          git push origin test
