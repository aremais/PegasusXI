name: Sync upstream into test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote if missing
        run: |
          $remotes = git remote
          if ($remotes -notcontains "upstream") {
            git remote add upstream https://github.com/LandSandBoat/server.git
          }

          git fetch upstream --tags

      - name: Merge upstream, preserve settings, and stop on all other conflicts
        run: |
          git checkout test

          git merge upstream/base --no-commit --no-ff
          $mergeExit = $LASTEXITCODE

          Write-Host "Restoring test version of settings/ and settings/default/"
          git restore --source=HEAD --staged --worktree -- settings settings/default 2>$null
          $global:LASTEXITCODE = 0

          $remainingConflicts = git diff --name-only --diff-filter=U

          if ($remainingConflicts) {
            Write-Host "Manual review is required for these conflicted files:"
            $remainingConflicts | ForEach-Object { Write-Host " - $_" }
            throw "Merge conflicts remain outside settings/. Resolve them manually."
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }

          git commit -m "Sync upstream/base into test (preserve settings)"
          git push origin test
