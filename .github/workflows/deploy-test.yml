name: Deploy Test (BetaTest)

# Pulls the Test branch onto the BetaTest / staging game server, builds, and restarts processes.
# Requires a self-hosted runner on the BetaTest machine with label "self-hosted".
on:
  workflow_dispatch:
    inputs:
      repo_path:
        description: 'Absolute path to the BetaTest server git checkout on the runner'
        required: true
        default: 'D:\server-test'
        type: string
  # Optional: auto-deploy whenever Test is updated (disable if you prefer manual only)
  # push:
  #   branches:
  #     - Test

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Update BetaTest from Test branch
    runs-on: self-hosted
    environment: Staging

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Stop LSB processes
        run: |
          $procNames = @('xi_connect','xi_world','xi_map','xi_search')

          foreach ($name in $procNames) {
            $procs = Get-Process -Name $name -ErrorAction SilentlyContinue
            if ($procs) {
              $procs | Stop-Process -Force
              Write-Host "Stopped $name"
            } else {
              Write-Host "$name was not running"
            }
          }

          Start-Sleep -Seconds 3

      - name: Update Test working copy
        run: |
          $RepoPath = '${{ inputs.repo_path }}'

          if (-not (Test-Path $RepoPath)) {
            throw "Repo path not found: $RepoPath. Clone the repo on the BetaTest server first (see documentation/BRANCH_SYNC_AND_DEPLOY.md)."
          }

          git -C $RepoPath fetch origin
          git -C $RepoPath checkout Test
          git -C $RepoPath reset --hard origin/Test
          git -C $RepoPath submodule update --init --recursive

          $sha = (git -C $RepoPath rev-parse HEAD).Trim()
          Write-Host "BetaTest server now at $sha (Test)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Deploy Test (BetaTest)`n`nUpdated ``$RepoPath`` to Test @ ``$sha``."

      - name: Build Test branch
        run: |
          $RepoPath = '${{ inputs.repo_path }}'

          cmake -S $RepoPath -B "$RepoPath\build" -A x64
          cmake --build "$RepoPath\build" --config Release --parallel

      - name: Start LSB processes
        run: |
          $RepoPath = '${{ inputs.repo_path }}'
          $candidateDirs = @(
            "$RepoPath\build\bin\Release",
            "$RepoPath\build\Release",
            $RepoPath
          )

          function Find-Exe([string]$exeName) {
            foreach ($dir in $candidateDirs) {
              $path = Join-Path $dir $exeName
              if (Test-Path $path) {
                return $path
              }
            }
            throw "Could not find $exeName in expected locations."
          }

          $connect = Find-Exe 'xi_connect.exe'
          $world   = Find-Exe 'xi_world.exe'
          $search  = Find-Exe 'xi_search.exe'
          $map     = Find-Exe 'xi_map.exe'

          Start-Process -FilePath $connect -WorkingDirectory (Split-Path $connect)
          Start-Sleep -Seconds 2

          Start-Process -FilePath $world -WorkingDirectory (Split-Path $world)
          Start-Sleep -Seconds 2

          Start-Process -FilePath $search -WorkingDirectory (Split-Path $search)
          Start-Sleep -Seconds 2

          Start-Process -FilePath $map -WorkingDirectory (Split-Path $map)

      - name: Verify processes started
        run: |
          $required = @('xi_connect','xi_world','xi_search','xi_map')

          foreach ($name in $required) {
            if (-not (Get-Process -Name $name -ErrorAction SilentlyContinue)) {
              throw "$name did not start successfully."
            }
          }

          Write-Host "BetaTest deployment completed successfully."
