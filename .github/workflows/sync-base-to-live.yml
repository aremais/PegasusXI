name: Promote base to Live

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote base to Live
        id: sync
        run: |
          git fetch origin base Live

          $before = (git rev-parse origin/Live).Trim()
          $target = (git rev-parse origin/base).Trim()

          "before=$before" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT

          if ($before -eq $target) {
            Write-Host "Live is already up to date with base."
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git checkout Live
          git merge origin/base --ff-only
          git push origin Live

          $after = (git rev-parse HEAD).Trim()
          "after=$after" >> $env:GITHUB_OUTPUT
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        if: steps.sync.outputs.changed == 'true'
        run: |
          $dateTag = Get-Date -Format "yyyy-MM-dd-HHmm"
          $output = "live-changelog-$dateTag.md"

          python tools/ci/generate_live_changelog.py `
            "${{ steps.sync.outputs.before }}" `
            "${{ steps.sync.outputs.after }}" `
            $output

          Get-Content $output

          "date_tag=$dateTag" >> $env:GITHUB_OUTPUT
          "changelog_path=$output" >> $env:GITHUB_OUTPUT

      - name: Add changelog to job summary
        if: steps.sync.outputs.changed == 'true'
        run: |
          Get-Content "${{ steps.changelog.outputs.changelog_path }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish Live release notes
        if: steps.sync.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-${{ steps.changelog.outputs.date_tag }}
          name: Live update ${{ steps.changelog.outputs.date_tag }}
          body_path: ${{ steps.changelog.outputs.changelog_path }}
          target_commitish: Live
          make_latest: true
