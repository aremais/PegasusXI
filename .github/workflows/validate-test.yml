name: Validate test branch

on:
  workflow_dispatch:
  push:
    branches:
      - test
  pull_request:
    branches:
      - live

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show tool versions
        shell: pwsh
        run: |
          git --version
          cmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
